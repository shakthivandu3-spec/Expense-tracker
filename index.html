<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->
        <aside class="sidebar">

            <h2 class="logo">Expense<span>Track</span></h2>

            <nav>
                <a href="#" class="active">Dashboard</a>
                <a href="#">Transactions</a>
                <a href="#">Analytics</a>
                <a href="#">Settings</a>
            </nav>

        </aside>


        <!-- Main Content -->
        <main class="main-content">

            <!-- Header -->
            <header class="topbar">

                <div>
                    <h1>Dashboard</h1>
                    <p>Welcome back! Here's your financial overview.</p>
                </div>

                <div class="profile">
                    <div class="profile-circle">SP</div>
                </div>

            </header>


            <!-- Summary Cards -->
            <section class="summary">

                <div class="summary-card balance-card">
                    <div class="card-icon">₹</div>

                    <div>
                        <p>Total Balance</p>
                        <h2 id="balance">₹0</h2>
                    </div>
                </div>


                <div class="summary-card income-card">
                    <div class="card-icon">↗</div>

                    <div>
                        <p>Total Income</p>
                        <h2 id="income">₹0</h2>
                    </div>
                </div>


                <div class="summary-card expense-card">
                    <div class="card-icon">↘</div>

                    <div>
                        <p>Total Expenses</p>
                        <h2 id="expense">₹0</h2>
                    </div>
                </div>

            </section>


            <!-- Content Grid -->
            <section class="content-grid">


                <!-- Add Transaction -->
                <div class="panel transaction-form">

                    <div class="panel-header">
                        <h2>Add Transaction</h2>
                        <span>+</span>
                    </div>


                    <label>Description</label>

                    <input
                        type="text"
                        id="description"
                        placeholder="e.g. Grocery shopping"
                    >


                    <label>Amount</label>

                    <input
                        type="number"
                        id="amount"
                        placeholder="Enter amount"
                    >


                    <label>Type</label>

                    <select id="type">

                        <option value="income">
                            Income
                        </option>

                        <option value="expense">
                            Expense
                        </option>

                    </select>


                    <label>Category</label>

                    <select id="category">

                        <option value="Food">
                            Food
                        </option>

                        <option value="Travel">
                            Travel
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Bills">
                            Bills
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>


                    <button
                        onclick="addTransaction()"
                        class="add-btn"
                    >
                        + Add Transaction
                    </button>

                </div>


                <!-- Transactions -->
                <div class="panel transactions">

                    <div class="panel-header">

                        <div>
                            <h2>Recent Transactions</h2>
                            <p>Your latest financial activity</p>
                        </div>

                        <button class="view-btn">
                            View All
                        </button>

                    </div>


                    <ul id="transactionList"></ul>

                </div>

            </section>

        </main>

    </div>


    <script src="script.js"></script>

</body>

</html>
